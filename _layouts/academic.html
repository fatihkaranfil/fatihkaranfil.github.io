<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{ page.description | default: 'Research, publications, teaching, and policy analysis by Fatih Karanfil, economist at KAPSARC.' | escape }}">
<title>{{ page.title }} | Fatih Karanfil</title>
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="stylesheet" href="{{ '/assets/css/academic.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/academic-pages.css' | relative_url }}">
</head>
<body>
<header class="site-header"><div class="shell header-inner"><a class="wordmark" href="{{ '/' | relative_url }}">Fatih Karanfil</a>
<nav aria-label="Main navigation">
<a {% if page.nav == 'home' %}class="active" aria-current="page"{% endif %} href="{{ '/' | relative_url }}">Home</a>
<a {% if page.nav == 'research' %}class="active" aria-current="page"{% endif %} href="{{ '/research/' | relative_url }}">Research</a>
<a href="{{ '/#policy-impact' | relative_url }}">Policy Impact</a>
<a {% if page.nav == 'publications' %}class="active" aria-current="page"{% endif %} href="{{ '/themes' | relative_url }}">Publications</a>
<a {% if page.nav == 'teaching' %}class="active" aria-current="page"{% endif %} href="{{ '/teaching' | relative_url }}">Teaching</a>
<a {% if page.nav == 'cv' %}class="active" aria-current="page"{% endif %} href="{{ '/cv' | relative_url }}">CV</a>
<a href="mailto:fatihkaranfil@gmail.com">Contact</a>
</nav></div></header>
<main id="main-content">{{ content }}</main>
<footer><div class="shell footer-inner"><span>© {{ site.time | date: '%Y' }} Fatih Karanfil</span><div><a href="mailto:fatihkaranfil@gmail.com">Email</a><a href="https://www.linkedin.com/in/fatihkaranfil/">LinkedIn</a><a href="https://scholar.google.com/citations?user=9DD36VEAAAAJ&amp;hl=en">Google Scholar</a></div></div></footer>
</body></html>
